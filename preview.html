<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=1200, initial-scale=1.0">
    <title>Preview - Дякую. Обійняв припідняв 💝</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            width: 1200px;
            height: 630px;
            display: flex;
            justify-content: center;
            align-items: center;
            margin: 0;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 25%, #f093fb 50%, #4facfe 75%, #00f2fe 100%);
            background-size: 400% 400%;
            animation: gradientShift 15s ease infinite;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            overflow: hidden;
            position: relative;
        }

        @keyframes gradientShift {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        .container {
            text-align: center;
            z-index: 10;
            padding: 40px;
        }

        .animated-text {
            font-size: 5rem;
            font-weight: bold;
            color: white;
            text-shadow:
                0 0 30px rgba(255, 255, 255, 0.6),
                0 0 60px rgba(255, 182, 193, 0.5),
                0 6px 12px rgba(0, 0, 0, 0.3);
            animation:
                float 3s ease-in-out infinite,
                pulse 2s infinite,
                colorChange 8s infinite;
            transform-origin: center;
            position: relative;
            line-height: 1.4;
            letter-spacing: 0.02em;
            backdrop-filter: blur(15px);
            -webkit-backdrop-filter: blur(15px);
            padding: 40px 60px;
            border-radius: 30px;
            background: rgba(255, 255, 255, 0.15);
            box-shadow:
                0 12px 48px 0 rgba(31, 38, 135, 0.37),
                inset 0 0 30px rgba(255, 255, 255, 0.15);
        }

        .hand {
            display: inline-block;
            animation: wave 1s ease-in-out infinite;
            margin-left: 15px;
            font-size: 1.2em;
            transform-origin: 70% 70%;
        }

        @keyframes float {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-25px); }
        }

        @keyframes pulse {
            0%, 100% {
                transform: scale(1);
                filter: brightness(1);
            }
            50% {
                transform: scale(1.03);
                filter: brightness(1.15);
            }
        }

        @keyframes colorChange {
            0% { color: #ffffff; }
            20% { color: #ff9a9e; }
            40% { color: #fad0c4; }
            60% { color: #a1c4fd; }
            80% { color: #fbc2eb; }
            100% { color: #ffffff; }
        }

        @keyframes wave {
            0%, 100% { transform: rotate(0deg); }
            10% { transform: rotate(14deg); }
            20% { transform: rotate(-8deg); }
            30% { transform: rotate(14deg); }
            40% { transform: rotate(-4deg); }
            50% { transform: rotate(10deg); }
            60% { transform: rotate(0deg); }
        }

        .hearts {
            position: fixed;
            top: 0;
            left: 0;
            width: 1200px;
            height: 630px;
            pointer-events: none;
            z-index: 1;
            overflow: hidden;
        }

        .heart {
            position: absolute;
            font-size: 2rem;
            animation: fall linear infinite;
            filter: drop-shadow(0 0 10px rgba(255, 107, 107, 0.7));
            will-change: transform, opacity;
        }

        .heart::before {
            content: '❤️';
        }

        @keyframes fall {
            0% {
                transform: translateY(-10vh) rotate(0deg) scale(0);
                opacity: 0;
            }
            10% {
                opacity: 1;
                transform: translateY(0) rotate(36deg) scale(1);
            }
            100% {
                transform: translateY(110vh) rotate(360deg) scale(0.5);
                opacity: 0;
            }
        }

        .sparkles {
            position: fixed;
            top: 0;
            left: 0;
            width: 1200px;
            height: 630px;
            pointer-events: none;
            z-index: 5;
        }

        .sparkle {
            position: absolute;
            width: 6px;
            height: 6px;
            background: white;
            border-radius: 50%;
            animation: sparkleAnimation linear infinite;
            box-shadow: 0 0 15px white, 0 0 30px white;
        }

        @keyframes sparkleAnimation {
            0% {
                opacity: 0;
                transform: scale(0) rotate(0deg);
            }
            50% {
                opacity: 1;
                transform: scale(1.5) rotate(180deg);
            }
            100% {
                opacity: 0;
                transform: scale(0) rotate(360deg);
            }
        }

        /* Watermark */
        .watermark {
            position: fixed;
            bottom: 20px;
            right: 30px;
            color: rgba(255, 255, 255, 0.8);
            font-size: 1.2rem;
            font-weight: 600;
            text-shadow: 0 2px 4px rgba(0, 0, 0, 0.3);
            z-index: 100;
            backdrop-filter: blur(5px);
            padding: 8px 16px;
            border-radius: 10px;
            background: rgba(255, 255, 255, 0.1);
        }
    </style>
</head>
<body>
    <div class="container">
        <h1 class="animated-text">Дякую. Обійняв припідняв<span class="hand">👋</span></h1>
    </div>

    <div class="hearts" id="hearts-container"></div>
    <div class="sparkles" id="sparkles-container"></div>
    <div class="watermark">nolimiter.github.io/script</div>

    <script>
        // Create floating hearts
        function createHearts() {
            const container = document.getElementById('hearts-container');
            const heartCount = 20;

            for (let i = 0; i < heartCount; i++) {
                setTimeout(() => {
                    const heart = document.createElement('div');
                    heart.classList.add('heart');

                    // Random position
                    heart.style.left = Math.random() * 100 + '%';

                    // Random size
                    const size = Math.random() * 1 + 1;
                    heart.style.fontSize = size + 'rem';

                    // Random animation duration
                    const duration = Math.random() * 5 + 5;
                    heart.style.animationDuration = duration + 's';

                    // Staggered start
                    heart.style.animationDelay = '0s';

                    container.appendChild(heart);

                    // Remove and recreate heart after animation
                    setTimeout(() => {
                        heart.remove();
                        createSingleHeart();
                    }, duration * 1000);
                }, i * 250);
            }
        }

        function createSingleHeart() {
            const container = document.getElementById('hearts-container');
            const heart = document.createElement('div');
            heart.classList.add('heart');

            heart.style.left = Math.random() * 100 + '%';
            const size = Math.random() * 1 + 1;
            heart.style.fontSize = size + 'rem';

            const duration = Math.random() * 5 + 5;
            heart.style.animationDuration = duration + 's';

            container.appendChild(heart);

            setTimeout(() => {
                heart.remove();
                createSingleHeart();
            }, duration * 1000);
        }

        // Create sparkles
        function createSparkles() {
            const container = document.getElementById('sparkles-container');
            const sparkleCount = 50;

            for (let i = 0; i < sparkleCount; i++) {
                const sparkle = document.createElement('div');
                sparkle.classList.add('sparkle');

                sparkle.style.left = Math.random() * 100 + '%';
                sparkle.style.top = Math.random() * 100 + '%';

                const duration = Math.random() * 3 + 2;
                sparkle.style.animationDuration = duration + 's';
                sparkle.style.animationDelay = Math.random() * 2 + 's';

                container.appendChild(sparkle);
            }
        }

        // Initialize
        window.addEventListener('load', function() {
            createHearts();
            createSparkles();
        });
    </script>
</body>
</html>
