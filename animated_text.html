    <!-- Theme Color -->
    <meta name="theme-color" content="#b21f1f">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            min-height: -webkit-fill-available;
            margin: 0;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 25%, #f093fb 50%, #4facfe 75%, #00f2fe 100%);
            background-size: 400% 400%;
            animation: gradientShift 15s ease infinite;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            overflow: hidden;
            position: relative;
        }

        @keyframes gradientShift {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        .container {
            text-align: center;
            z-index: 10;
            padding: 20px;
            max-width: 90%;
        }

        .animated-text {
            font-size: clamp(1.5rem, 8vw, 4.5rem);
            font-weight: bold;
            color: white;
            text-shadow:
                0 0 20px rgba(255, 255, 255, 0.5),
                0 0 40px rgba(255, 182, 193, 0.4),
                0 4px 8px rgba(0, 0, 0, 0.3);
            animation:
                float 3s ease-in-out infinite,
                pulse 2s infinite,
                colorChange 8s infinite;
            transform-origin: center;
            position: relative;
            line-height: 1.4;
            letter-spacing: 0.02em;
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            padding: 20px;
            border-radius: 20px;
            background: rgba(255, 255, 255, 0.1);
            box-shadow:
                0 8px 32px 0 rgba(31, 38, 135, 0.37),
                inset 0 0 20px rgba(255, 255, 255, 0.1);
        }

        .hand {
            display: inline-block;
            animation: wave 1s ease-in-out infinite;
            margin-left: 10px;
            font-size: 1.2em;
            transform-origin: 70% 70%;
        }

        @keyframes float {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-20px); }
        }

        @keyframes pulse {
            0%, 100% {
                transform: scale(1);
                filter: brightness(1);
            }
            50% {
                transform: scale(1.03);
                filter: brightness(1.1);
            }
        }

        @keyframes colorChange {
            0% { color: #ffffff; }
            20% { color: #ff9a9e; }
            40% { color: #fad0c4; }
            60% { color: #a1c4fd; }
            80% { color: #fbc2eb; }
            100% { color: #ffffff; }
        }

        @keyframes wave {
            0%, 100% { transform: rotate(0deg); }
            10% { transform: rotate(14deg); }
            20% { transform: rotate(-8deg); }
            30% { transform: rotate(14deg); }
            40% { transform: rotate(-4deg); }
            50% { transform: rotate(10deg); }
            60% { transform: rotate(0deg); }
        }

        .hearts {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 1;
            overflow: hidden;
        }

        .heart {
            position: absolute;
            font-size: 1.5rem;
            animation: fall linear forwards;
            filter: drop-shadow(0 0 8px rgba(255, 107, 107, 0.6));
            will-change: transform, opacity;
        }

        .heart::before {
            content: '❤️';
        }

        @keyframes fall {
            0% {
                transform: translateY(-10vh) rotate(0deg) scale(0);
                opacity: 0;
            }
            10% {
                opacity: 1;
                transform: translateY(0) rotate(36deg) scale(1);
            }
            100% {
                transform: translateY(110vh) rotate(360deg) scale(0.5);
                opacity: 0;
            }
        }

        /* Sparkles effect */
        .sparkles {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 5;
        }

        .sparkle {
            position: absolute;
            width: 4px;
            height: 4px;
            background: white;
            border-radius: 50%;
            animation: sparkleAnimation linear infinite;
            box-shadow: 0 0 10px white, 0 0 20px white;
        }

        @keyframes sparkleAnimation {
            0% {
                opacity: 0;
                transform: scale(0) rotate(0deg);
            }
            50% {
                opacity: 1;
                transform: scale(1) rotate(180deg);
            }
            100% {
                opacity: 0;
                transform: scale(0) rotate(360deg);
            }
        }

        /* Mobile optimizations */
        @media (max-width: 768px) {
            body {
                background-size: 600% 600%;
            }

            .animated-text {
                font-size: clamp(1.2rem, 6vw, 2.5rem);
                padding: 15px;
                border-radius: 15px;
                line-height: 1.3;
            }

            .hand {
                font-size: 1.1em;
                margin-left: 5px;
            }

            .heart {
                font-size: 1.2rem;
            }

            .container {
                padding: 15px;
            }
        }

        @media (max-width: 480px) {
            .animated-text {
                font-size: clamp(1rem, 5vw, 1.8rem);
                padding: 12px;
                word-break: break-word;
            }

            .heart {
                font-size: 1rem;
            }
        }

        /* Prevent iOS zoom on input focus */
        @media (max-width: 768px) {
            html {
                -webkit-text-size-adjust: 100%;
                text-size-adjust: 100%;
            }
        }

        /* Dark mode support */
        @media (prefers-color-scheme: dark) {
            .animated-text {
                text-shadow:
                    0 0 25px rgba(255, 255, 255, 0.6),
                    0 0 50px rgba(255, 182, 193, 0.5),
                    0 4px 8px rgba(0, 0, 0, 0.4);
            }
        }

        /* Landscape mobile optimization */
        @media (max-width: 896px) and (orientation: landscape) {
            body {
                align-items: flex-start;
                padding-top: 5vh;
            }

            .animated-text {
                font-size: clamp(1rem, 4vh, 2rem);
                padding: 10px;
            }
        }

        /* Accessibility - Reduced motion */
        @media (prefers-reduced-motion: reduce) {
            *,
            *::before,
            *::after {
                animation-duration: 0.01ms !important;
                animation-iteration-count: 1 !important;
                transition-duration: 0.01ms !important;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <h1 class="animated-text">Дякую. Обійняв припідняв<span class="hand">👋</span></h1>
    </div>

    <div class="hearts" id="hearts-container"></div>
    <div class="sparkles" id="sparkles-container"></div>

    <script>
        // Prevent page bounce on iOS
        document.body.addEventListener('touchmove', function(e) {
            if (e.target === document.body) {
                e.preventDefault();
            }
        }, { passive: false });

        // Create floating hearts
        function createHearts() {
            const container = document.getElementById('hearts-container');
            const heartCount = window.innerWidth < 768 ? 15 : 25;

            for (let i = 0; i < heartCount; i++) {
                setTimeout(() => {
                    const heart = document.createElement('div');
                    heart.classList.add('heart');

                    // Random position
                    heart.style.left = Math.random() * 100 + 'vw';

                    // Random size (smaller on mobile)
                    const maxSize = window.innerWidth < 768 ? 1.2 : 1.8;
                    const minSize = window.innerWidth < 768 ? 0.6 : 0.8;
                    const size = Math.random() * (maxSize - minSize) + minSize;
                    heart.style.fontSize = size + 'rem';

                    // Random animation duration
                    const duration = Math.random() * 6 + 6;
                    heart.style.animationDuration = duration + 's';

                    // Staggered start
                    heart.style.animationDelay = '0s';

                    container.appendChild(heart);

                    // Remove heart after animation
                    setTimeout(() => {
                        heart.remove();
                        // Create new heart to maintain count
                        if (document.visibilityState === 'visible') {
                            createSingleHeart();
                        }
                    }, duration * 1000);
                }, i * 300);
            }
        }

        function createSingleHeart() {
            const container = document.getElementById('hearts-container');
            const heart = document.createElement('div');
            heart.classList.add('heart');

            heart.style.left = Math.random() * 100 + 'vw';
            const maxSize = window.innerWidth < 768 ? 1.2 : 1.8;
            const minSize = window.innerWidth < 768 ? 0.6 : 0.8;
            const size = Math.random() * (maxSize - minSize) + minSize;
            heart.style.fontSize = size + 'rem';

            const duration = Math.random() * 6 + 6;
            heart.style.animationDuration = duration + 's';

            container.appendChild(heart);

            setTimeout(() => {
                heart.remove();
                if (document.visibilityState === 'visible') {
                    createSingleHeart();
                }
            }, duration * 1000);
        }

        // Create sparkles
        function createSparkles() {
            const container = document.getElementById('sparkles-container');
            const sparkleCount = window.innerWidth < 768 ? 20 : 40;

            for (let i = 0; i < sparkleCount; i++) {
                const sparkle = document.createElement('div');
                sparkle.classList.add('sparkle');

                sparkle.style.left = Math.random() * 100 + 'vw';
                sparkle.style.top = Math.random() * 100 + 'vh';

                const duration = Math.random() * 3 + 2;
                sparkle.style.animationDuration = duration + 's';
                sparkle.style.animationDelay = Math.random() * 2 + 's';

                container.appendChild(sparkle);
            }
        }

        // Handle visibility change to pause animations when tab is not visible
        document.addEventListener('visibilitychange', function() {
            if (document.visibilityState === 'hidden') {
                document.body.style.animationPlayState = 'paused';
            } else {
                document.body.style.animationPlayState = 'running';
            }
        });

        // Initialize on load
        window.addEventListener('load', function() {
            createHearts();
            createSparkles();
        });

        // Handle orientation change on mobile
        window.addEventListener('orientationchange', function() {
            setTimeout(function() {
                location.reload();
            }, 200);
        });
    </script>
</body>
</html>
